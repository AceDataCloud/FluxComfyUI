[project]
name = "flux"
version = "0.1.1"
description = "Flux Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/FluxComfyUI"
Documentation = "https://github.com/AceDataCloud/FluxComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/FluxComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Flux by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/FluxComfyUI/main/assets/logo-400.png"
